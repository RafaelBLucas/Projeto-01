<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style></style>
    <title>meu texto</title>
  </head>
  <body>
    <h1 id="texto">meu texto</h1>
    <button onclick="mudarCor()">mudar cor</button>
    <button onclick="voltaCor()">voltar cor</button>
    <script>
      function mudarCor() {
        document.getElementById("texto").style.color = "red";
      }
      function voltaCor() {
        document.getElementById("texto").style.color = "black";
      }
    </script>
  </body>
</html>
